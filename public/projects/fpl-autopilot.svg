<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-label="FPL Autopilot poster">
  <style>
    .fp-cap {
      transform-box: fill-box;
      transform-origin: center;
      animation: fp-cap 2.6s ease-in-out infinite;
    }
    @keyframes fp-cap {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.25); }
    }
    .fp-out { animation: fp-swap-out 4.5s ease-in-out infinite; }
    .fp-in { animation: fp-swap-in 4.5s ease-in-out infinite; }
    @keyframes fp-swap-out {
      0%, 35% { opacity: 0.85; }
      55%, 100% { opacity: 0.15; }
    }
    @keyframes fp-swap-in {
      0%, 35% { opacity: 0.15; }
      55%, 100% { opacity: 0.9; }
    }
    .fp-arrow {
      stroke-dasharray: 220;
      animation: fp-arrow 4.5s ease-in-out infinite;
    }
    @keyframes fp-arrow {
      0%, 30% { stroke-dashoffset: 220; opacity: 0; }
      40% { opacity: 1; }
      60%, 85% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }
    .fp-btn { animation: fp-btn 4.5s steps(1) infinite; }
    @keyframes fp-btn {
      0%, 8% { opacity: 1; }
      9%, 14% { opacity: 0.55; }
      15%, 100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .fp-in { opacity: 0.9; }
      .fp-arrow { opacity: 1; stroke-dashoffset: 0; }
    }
  </style>
  <rect width="1600" height="1200" fill="#121411"/>

  <!-- pitch -->
  <g fill="none" stroke="#e9e7e1" stroke-opacity="0.28">
    <rect x="300" y="180" width="1000" height="760"/>
    <line x1="300" y1="560" x2="1300" y2="560"/>
    <circle cx="800" cy="560" r="110"/>
    <rect x="560" y="180" width="480" height="130"/>
    <rect x="560" y="810" width="480" height="130"/>
  </g>
  <g stroke="#e9e7e1" stroke-opacity="0.05">
    <line x1="300" y1="332" x2="1300" y2="332"/>
    <line x1="300" y1="484" x2="1300" y2="484"/>
    <line x1="300" y1="636" x2="1300" y2="636"/>
    <line x1="300" y1="788" x2="1300" y2="788"/>
  </g>

  <!-- formation dots: 1-4-4-2 -->
  <g fill="#e9e7e1" fill-opacity="0.75">
    <circle cx="800" cy="250" r="16"/>
    <circle cx="440" cy="400" r="16"/>
    <circle cx="680" cy="400" r="16"/>
    <circle cx="920" cy="400" r="16"/>
    <circle cx="1160" cy="400" r="16"/>
    <circle cx="440" cy="620" r="16"/>
    <circle cx="680" cy="620" r="16"/>
    <circle cx="1160" cy="620" r="16"/>
    <circle cx="680" cy="840" r="16"/>
  </g>

  <!-- captain -->
  <g>
    <circle class="fp-cap" cx="920" cy="840" r="22" fill="#bf5fff"/>
    <text x="920" y="796" text-anchor="middle" font-family="monospace" font-size="22" letter-spacing="2" fill="#bf5fff">C — 8.4 xP</text>
  </g>

  <!-- transfer: out fades, arrow draws, in appears -->
  <circle class="fp-out" cx="920" cy="620" r="16" fill="#e9e7e1"/>
  <path class="fp-arrow" d="M980 620 Q 1080 560 1160 620" fill="none" stroke="#bf5fff" stroke-width="4" stroke-linecap="round"/>
  <circle class="fp-in" cx="1160" cy="620" r="16" fill="#bf5fff"/>
  <text x="1070" y="530" text-anchor="middle" font-family="monospace" font-size="20" letter-spacing="3" fill="#e9e7e1" fill-opacity="0.45">-4 HIT? NO.</text>

  <!-- analyze button -->
  <g class="fp-btn">
    <rect x="580" y="1000" width="440" height="72" fill="#bf5fff"/>
    <text x="800" y="1046" text-anchor="middle" font-family="monospace" font-size="26" letter-spacing="6" fill="#121411" font-weight="bold">ANALYZE MY TEAM</text>
  </g>

  <text x="160" y="112" font-family="monospace" font-size="26" letter-spacing="6" fill="#e9e7e1" fill-opacity="0.55">FPL AUTOPILOT — 03</text>
  <text x="1440" y="112" text-anchor="end" font-family="monospace" font-size="22" letter-spacing="5" fill="#bf5fff" fill-opacity="0.8">GW 5 — DEADLINE FRI 18:30</text>
  <text x="160" y="1128" font-family="monospace" font-size="22" letter-spacing="5" fill="#e9e7e1" fill-opacity="0.35">ENGINE DECIDES — GEMINI EXPLAINS</text>
</svg>
